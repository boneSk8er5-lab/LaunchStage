<!DOCTYPE html>
<html>

<head lang="en">
    <title>LaunchStage profile</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Profile">
        <sdpi-select setting="profile" datasource="getProfiles" show-refresh placeholder="Pick a profile"></sdpi-select>
    </sdpi-item>

    <sdpi-item label="When pressed">
        <sdpi-select setting="mode" default="toggle">
            <option value="toggle">Open it, or close it if it's open</option>
            <option value="open">Open it</option>
            <option value="close">Close it</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="">
        <p style="margin: 0; font-size: 9pt; opacity: 0.7;">
            The button lights up while the profile is open. LaunchStage needs to be running (it can wait in the tray).
            Closing always asks to save first, one app at a time.
        </p>
    </sdpi-item>
</body>

</html>
